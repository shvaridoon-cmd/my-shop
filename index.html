<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Manifestation Shop</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- HEADER IMAGE -->
  <header class="banner">
    <img src="header.jpg" alt="Header Image">
  </header>

  <section class="title-area">
    <h1>Manifestation Shop</h1>
    <p>Everything here is free for you. Claim it.</p>
  </section>

  <main class="layout">

    <!-- LEFT SIDE -->
    <section class="items-section">
      <h2>Your Wishlist</h2>

      <div id="items" class="items-grid">
        <!-- Example items -->
        <div class="item-card">
          <img src="header.jpg" class="item-img">
          <h3>Dream Apartment</h3>
          <button class="add-btn" data-name="Dream Apartment">Add to cart</button>
        </div>

        <div class="item-card">
          <img src="header.jpg" class="item-img">
          <h3>Perfect Grades</h3>
          <button class="add-btn" data-name="Perfect Grades">Add to cart</button>
        </div>

        <div class="item-card">
          <img src="header.jpg" class="item-img">
          <h3>Healthy Glowing Skin</h3>
          <button class="add-btn" data-name="Healthy Glowing Skin">Add to cart</button>
        </div>
      </div>

      <!-- ADD NEW ITEM -->
      <div class="add-item">
        <h3>Add a new desire</h3>

        <form id="addItemForm">
          <label>
            Name:
            <input type="text" id="itemName" required>
          </label>

          <label>
            Upload an image:
            <input type="file" id="itemImage" accept="image/*">
          </label>

          <button type="submit">Add to wishlist</button>
        </form>
      </div>
    </section>

    <!-- RIGHT SIDE -->
    <aside class="cart-section">
      <h2>Your Cart</h2>
      <ul id="cartList" class="cart-list"></ul>

      <div class="cart-footer">
        <p>Total items: <span id="cartCount">0</span></p>
        <button id="checkoutBtn">Checkout</button>
      </div>

      <p class="note">Everything you choose already belongs to you.</p>
    </aside>

  </main>

  <!-- OVERLAY -->
  <div id="overlay" class="overlay hidden">
    <div class="overlay-content">
      <h2>Order Confirmed</h2>
      <p>It already belongs to you. It’s yours.</p>
      <button id="closeOverlay">Close</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
